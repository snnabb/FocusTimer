name: Validate Komari iOS

on:
  workflow_dispatch:
  push:
    paths:
      - KomariMonitor/**
      - .github/workflows/validate-komari-ios.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: KomariMonitor
        run: xcodegen generate
      - name: Build for iPhone 17 simulator
        run: |
          xcodebuild \
            -project KomariMonitor/KomariMonitor.xcodeproj \
            -scheme KomariMonitor \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            CODE_SIGNING_ALLOWED=NO \
            build
